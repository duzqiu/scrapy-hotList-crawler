services:
  crawler:
    build:
      # Docker fetches the pushed Git context, so the image always matches the
      # committed source. Commit and push Dockerfile, requirements and scripts
      # before deploying.
      context: "${GIT_REPOSITORY:-https://github.com/duzqiu/scrapy-hotList-crawler.git}#${GIT_REF:-main}"
      dockerfile: Dockerfile
    image: scrapy-hotlist-crawler:latest
    pull_policy: build
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SCRAPY_SETTINGS_MODULE: scrapy_hotlist_crawler.settings
    command: ["/app/run-scheduled-spiders.sh"]
    stop_grace_period: 30s
